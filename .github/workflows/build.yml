name: Build unsigned IPA

# Builds on a GitHub-hosted macOS runner so no Mac is needed. The artifact is
# an *unsigned* .ipa; AltStore on the Windows side signs it with the free Apple
# ID at install time. That is also why there are no secrets here -- nothing in
# this workflow touches a certificate.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # PINNED DELIBERATELY -- do not move to macos-latest.
    #
    # The app targets iOS 12.0, which the current toolchain no longer officially
    # supports: Xcode 16 states iOS 15 as its minimum deployment target, and
    # there are reports of Xcode 16 builds crashing on iOS 12 even when the
    # build succeeds. Xcode 15 still officially supports an iOS 12 deployment
    # target, so the build is pinned to a runner image that carries it.
    #
    # This window is closing. macOS 13 was retired in December 2025 and macOS 14
    # is scheduled to be fully unsupported by November 2026. When macos-14 goes,
    # this pin must move to a self-hosted runner, a container, or the project
    # accepts an Xcode 16 build and tests hard on the device.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Install XcodeGen 2.40.1
        # PINNED, like the Xcode version and for the same reason.
        #
        # `brew install xcodegen` gives the current release, which writes
        # objectVersion 77 (Xcode 16 format) and ignores the objectVersion
        # option in project.yml. Xcode 15.4 cannot read that, and says so only
        # as "Unable to read project" with no mention of a version.
        #
        # 2.40.1 (April 2024) predates Xcode 16, so it emits a format the
        # pinned toolchain parses. Three pins now move together -- runner
        # image, Xcode, and XcodeGen -- all forced by the iOS 12 target.
        run: |
          curl -fsSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.40.1/xcodegen.zip
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
          ./xcodegen/bin/xcodegen --version

      - name: Generate project
        # The object version is printed because a mismatch between it and the
        # pinned Xcode surfaces only as "Unable to read project", with no hint
        # that the format is the problem.
        run: |
          xcodegen generate
          grep -m1 'objectVersion' Midstream.xcodeproj/project.pbxproj

      - name: Build
        # Unsigned: no team, no provisioning profile, no certificate on the
        # runner. Signing happens on the Windows side.
        run: |
          xcodebuild \
            -project Midstream.xcodeproj \
            -scheme Midstream \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package .ipa
        # An .ipa is a zip with the .app inside a Payload/ directory. Doing it
        # by hand avoids xcodebuild's export step, which insists on a signing
        # team we do not have.
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Midstream.ipa Payload
          ls -lh Midstream.ipa

      - name: Verify deployment target
        # Cheap guard against a toolchain bump silently raising the floor above
        # the iPad's 12.5.8 -- which would install fine and then refuse to launch.
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          MIN=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          echo "MinimumOSVersion = $MIN"
          case "$MIN" in
            12.*) echo "ok" ;;
            *) echo "REFUSING: built for iOS $MIN, the iPad runs 12.5.8"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Midstream-ipa
          path: Midstream.ipa
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The succession plan, run on every build rather than discovered in a panic.
  #
  # macos-14 (Xcode 15.4) is scheduled to be fully unsupported by November 2026,
  # and macos-15 carries NO Xcode 15.x at all -- its oldest is 16.0. So the
  # question "can Xcode 16 build a working iOS 12 binary?" has a deadline, and
  # the only time it can be answered cheaply is now, while the known-good
  # toolchain still exists to compare against.
  #
  # This job builds the identical source with Xcode 16 and compares the two
  # binaries. It is allowed to fail: a red canary is information, not a broken
  # build. What it must never do is fail silently in November.
  canary-xcode16:
    runs-on: macos-15
    continue-on-error: true
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Install XcodeGen 2.40.1
        run: |
          curl -fsSL -o xcodegen.zip \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.40.1/xcodegen.zip
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate and build
        run: |
          xcodegen generate
          xcodebuild \
            -project Midstream.xcodeproj \
            -scheme Midstream \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Report what Xcode 16 actually produced
        # The reported Xcode 16 failure mode is a build that succeeds and then
        # crashes on launch under iOS 12, so "it compiled" proves nothing. These
        # three facts are what would differ: the declared floor, the platform
        # version recorded in the load commands, and whether the Swift runtime
        # is still bundled (below iOS 12.2 it must be).
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
          echo "--- LC_BUILD_VERSION / minos ---"
          otool -l "$APP/Midstream" | grep -A4 'LC_BUILD_VERSION\|LC_VERSION_MIN_IPHONEOS' | head -20
          echo "--- bundled Swift runtime ---"
          ls "$APP/Frameworks" 2>/dev/null | head -20 || echo "NO Frameworks dir -- Swift runtime not bundled, WILL NOT LAUNCH below iOS 12.2"

      - name: Package canary .ipa
        # Shipped as an artifact so the one remaining unknown -- whether an
        # Xcode 16 build actually *launches* on 12.5.8 -- can be settled on the
        # device today, sideloaded next to the known-good build, rather than
        # discovered after the Xcode 15 runners are gone.
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Midstream-xcode16.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Midstream-ipa-xcode16-canary
          path: Midstream-xcode16.ipa
          retention-days: 30
